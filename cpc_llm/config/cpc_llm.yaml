## Config parameters for generation jobs (initial and iterative)
## Note: An initial generation job will generate (iterative_generation.init_args.sample_size * iterative_generation.init_args.max_iterations * sampling_gen_batch_size) samples.
##       Similarly, a later iteration generation job will generate (iterative_generation.args.sample_size * iterative_generation.args.max_iterations * sampling_gen_batch_size) samples.
##       However, these later iteration generation jobs are mainly used as proposals to rejection sampling, so fewer samples are actually used for adding to train/cal.
iterative_generation:
  num_jobs: 6  # number of generation jobs to parallelize this over
  permissive_parsing: True #False #True #False
  min_rel_len_feasible_particle: 1.0 ## Minimum length of feasible particle as a fraction of test_fn dim
  init_args:
    ## init args just for first iteration:
    sample_size: 20 #20 #100 #20
    max_iterations: 25 #100 #120 #200 #50 #100 #200
    sampling_method: "ranked_fft" #"best_scoring" #"uniform"
    seed: 0
  args:
    ## Args for after first iteration:
    sanity_check: False
    log_level: info
    seed: 0
    test_fn_type: "ehrlich"  # [ehrlich, mt_fuji]
    subsample_seeds: True ## Whether to subsample input seeds (with replacement), or to iterate through all of them
    sample_size: 10 #10 #100 #200  # initial number of seeds to use for iterative generation
    max_iterations: 25 #60 #120 #120 #50 #100 #10
    sampling_method: "best_scoring" ## Method for selecting seeds # "uniform", "combination", "best_scoring"
    generation_config:
      max_new_tokens: 256
  slurm_args:
    nodes: 1
    cpus_per_task: 1
    ntasks_per_node: 1
    #gpus_per_node: 1
    partition: "preempt-priority"
    open_mode: "append"
    export: "ALL"
    time: "24:00:00"
    mem: "100GB" #"300GB" #"100GB"
    account: "ai4dd"
    qos: "preempt"
    gres: "gpu:b200:1"
