log_level: info
run_name: smaller_pythia 

## Make sure to update these paths to your own local and storage (parent) paths for output directories!
local_output_dir: /cv/scratch/u/prinstea/conformal-policy-control/cpc_llm/local_output_replication
parent_output_dir: /cv/data/ai4dd/data/prinstea/conformal-policy-control/cpc_llm/parent_output_replication

## Modify this string for saving different experimental settings
setting_str: cpc_llm_replication


## Global random seeds to loop over for different replication trials
initial_seed: 0
last_seed: 1 ## Inclusive, so if initial_seed = 0 and last_seed = 1, will run seeds 0 and 1 (2 trials total)


## Overwrite flags for each job type. If False, will only run the job if the output file does not already exist.
overwrite_ga: False ## If False, will only run genetic algorithm when output file does not already exist.
overwrite_initial_sft: False ## If False, will only run SFT when output file does not already exist.
overwrite_init_sft_formatter: False
overwrite_initg: False #False ## If False, will only run initial generation when output file does not already exist.
overwrite_seeds_flag: False
overwrite_split_init: False
overwrite_sft: False ## If False, will only run SFT when output file does not already exist.
overwrite_ig: False ## If False, will only run iterative generation when output file does not already exist.
overwrite_split: False
overwrite_cg: False ## If False, will only run contrastive generation when output file does not already exist.
overwrite_cmp_lik_all: False #False #True ## If False, will only run compute_likelihoods_all_models when output file doesn't exist.
overwrite_sft_formatter: False
overwrite_marge: False # If False, will only run remaining jobs (that don't have their own overwrite flag) when output file does not exist.
overwrite: False #True # If False, will only run remaining jobs (that don't have their own overwrite flag) when output file does not exist.
overwrite_dpo_formatter: False #True
overwrite_dpo: False #True # If False, will only run remaining jobs (that don't have their own overwrite flag) when output file does not exist.

retrain_initial_sft_each_trial: True ## If True, will retrain the initial SFT for each trial (seed)


## Run flags for different parts of the pipeline (default)
run_conformal_policy_control: True
run_evol_dataset_gen: True
run_propen_sft_dataset_formatting: True
run_initial_sft: True
run_sft: True
run_init_gen: True ## Whether to run initial generation
run_iter_gen: True
run_compute_liks_all_models_and_cal_data: True ## Whether to run likelihood computation for all models (for policy control)
run_propen_dpo_dataset_formatting: True

init_generation_sampling_num_return_sequences: 10 #10 ## Number of sequences to sample at each intialization generation stage
generation_sampling_num_return_sequences: 10 #20 #10 ## Number of sequences to sample at each iterative generation (policy improvement) stage
# unconditional_sampling_num_return_sequences: 10 ## Number of sequences to sample from density model, for initial CP cal

num_labels_after_first_round: 2000 # num. of labels to use in all rounds after the first

## Parameters for carrying over some amount of old data or seeds into current round
proportion_of_old_data: 0.2 #0.3333 #1.0 #0.0  # proportion of old training data to include in the running "combined" dataset (used for selecting seeds)
min_num_data_old: 50 #100 ## If proportion_of_old_data > 0.0, min number of old data samples to include in training
proportion_of_old_seeds: 0.2 #0.5 ## proportion of seeds from previous training data to use in current optimized policy (rest are from most recent round)
select_old_seeds_from: "init" #"last" ## "last" or "init"

seed: 0
greedy_decoding: False ## For initial and iterative
temperature_scaling: False #True
job_submission_system: direct #slurm
greedy_gen_batch_size: 64
sampling_gen_batch_size: 32
initial_model: "EleutherAI/pythia-14m" # "EleutherAI/pythia-2.8b"
sanity_check: False  # will be propagated to all training + generation jobs
path_to_repo: null # /scratch/ac5968/llome

## Conformal policy control params
random_seed: 0 ## For train/cal set splits


## For how to split cal vs train sets
split:
  cal_frac: 0.333  ## Fraction of generated outputs to place in calibration data (rather than training) at each time
  train_frac_from_non_cal: 1.0 ## Fraction of *non-cal, deduplicated* generated outputs to place in training data (rather than calibration) at each time
  train_sampling_method: "best_scoring" # "best_scoring", "uniform"
  num_cal_per_step: 10
  num_train_per_step: 40

## If using ranked FFT for selecting seeds, top fraction of particles to construct library from
ranked_fft_top_fraction: 0.001 #0.01
# ranked_fft_top_n: 100 ## top number of particles to construct library from

temperature_init: 1.0 #1.0 #0.8 #1.0
temperature: 1.0 #1.0

# Note: each num_*_rounds runs N-1 policy improvement iterations (round 0 is initial SFT)
num_dpo_rounds: 20
num_init_sft_rounds: 1 #5 #10
num_sft_rounds: 0 #10
num_marge_rounds: 0 #10



## Primary config parameters for conformal policy control (CPC) algorithm. See paper for details.
conformal_policy_control:
  alpha: 0.8  ### *** IMPORTANT: This is the main parameter to change for different CPC alpha levels ***
  mixture_proposal: True ## Whether to do mixture proposal in place of optimized proposal (else use safe and then optimized proposal)
  mixture_proposal_factor: 0.25 #0.05 ## Do mixture proposal if mixture_proposal_factor * overlap_coef_{safe} < overlap_coef_{unconstrained}. So, 0 or -1 does nothing
  mixture_proposal_subsample_cpc: False # For each beta, whether to subsample when re-computing candidate's normalization constant
  optimized_proposal_factor: 1 #1 ## Do optimized proposal if optimized_proposal_factor *overlap_coef_{safe} < overlap_coef_{unconstrained}. So, 0 or -1 does nothing
  min_safe_mix_weight: "adaptive" #0.1 ## When set to "adaptive", will use (1 - alpha) ** 4 as the minimum weight on safe proposals
  min_beta_mix_prop: 1e-80
  ind_metropolis_hastings: False ## Whether to only use independence MH sampling (rather than try rejection sampling first)
  num_AR_before_MH: 10 ## Number of AR generation iterations to try before switching to IMH sampling (only runs IMH if less than max_total_AR_calls)
  constrain_against: "init" ## "init" or "last": whether to constrain against the initial safe policy, or the last/most recent safe policy. Paper's theory assumes init
  use_overlap_mix_weight: True ## Whether to use overlap coefficient mixture weight; else, use 1 / (1 + beta)
  randomized_cpc: False # Keep this False
  test_pt_scale_factor: 1.0 #25
  num_starts_beta_search: 1
  args:
    n_grid: 200 ## Approx size of grid to search over for lik-ratio bound    
  accept_reject:
    max_total_AR_calls: 20 #15 #30 #40
    n_target_pre_cpc: 2000 ## Pre-CPC calibration, how many samples from safe/optimized policy to estimate normalization constants, overlap coefficients, etc.
    n_target_post_cpc: 200 ## Post-CPC calibration, how many samples to target drawing during rejection sampling, to then be split next round's train/cal data.
    iwmci_intersect_thresh: 0.5
    n_opt_prop_calls_pre_cpc_quarter_check: 5
    env_const_scale_emp_max: 1.0 #1.0 #1.05 ## Factor by which to scale the empirical maximum likelihood ratio for estimating envelope constant



